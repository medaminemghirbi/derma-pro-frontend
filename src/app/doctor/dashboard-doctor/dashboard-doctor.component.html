<div class="main-wrapper">
  <div class="main-wrapper">
    <app-doctor-header></app-doctor-header>
    <app-notifiacation-alert></app-notifiacation-alert>
    <app-doctor-sidebar></app-doctor-sidebar>

    <div class="page-wrapper">
      <div class="content pb-0">

        <!-- Trial Bar -->
        <div *ngIf="showTrialBar" class="trial-bar">
          <div class="trial-text">
            <span class="emoji">🚀</span>
            <div>
              <strong>Trial Mode</strong>
              <small>Your plan is in trial mode</small>
            </div>
          </div>

          <div class="trial-countdown">
            <span>{{ daysLeft }}d</span> :
            <span>{{ hoursLeft }}h</span> :
            <span>{{ minutesLeft }}m</span> :
            <span>{{ secondsLeft }}s</span>
          </div>

          <span class="close-trial" (click)="closeTrialBar()">✖</span>
        </div>

        <!-- Progress Bar -->
        <div *ngIf="showTrialBar" class="trial-progress">
          <div class="trial-progress-fill" [style.width.%]="progress"></div>
        </div>

        <!-- Modules -->
        <div class="modules-wrapper">
          <h2 class="modules-title">Available Modules</h2>
          <div class="modules-grid">
            <div class="module-card" *ngFor="let module of [
              { icon: 'service.png', label: 'Account' },
              { icon: 'calendrier.png', label: 'Agenda' },
              { icon: 'patient.png', label: 'Patients' },
              { icon: 'rh.png', label: 'HR Module' },
              { icon: 'ia.png', label: 'Intelligent Prescription' },
              { icon: 'notification.png', label: 'Manage Notifications' },
              { icon: 'document.png', label: 'Manage Documents' },
              { icon: 'multilang.png', label: 'Multi-Language Platform' },
              { icon: 'assistance.png', label: 'AI Assistance' },
              { icon: 'parametre.png', label: 'System Customisation' }

            ]">
              <div class="icon-bg">
                <img [src]="'assets/icons/' + module.icon" [alt]="module.label">
              </div>
              <p>{{ module.label }}</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
