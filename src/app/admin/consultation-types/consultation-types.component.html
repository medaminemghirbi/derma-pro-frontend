<div class="main-wrapper">
    <app-header-admin></app-header-admin>
    <app-sidebar-admin></app-sidebar-admin>
    <app-spinner [isLoading]="isLoading"></app-spinner>
    <ng-progress #progressBar></ng-progress>

    <div class="page-wrapper">
        <div class="content">
            <div class="row">
                <div class="col-sm-12">
                    <div class="card card-table show-entire">
                        <div class="card-body">
                            <div class="page-table-header mb-2">
                                <div class="row align-items-center">
                                    <div class="col">
                                        <div class="doctor-table-blk">
                                            <h3>Consultation Type List({{filterdConsultationTypes?.length}})</h3>
                                            <div class="doctor-search-blk">
                                                <div class="add-group">
                                                    <a href="javascript:;" class="btn btn-primary doctor-refresh ms-2"
                                                        (click)="refreshConsultationTypes()">
                                                        <img src="assets/img/icons/re-fresh.svg" alt>
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>


                            <div class="table-responsive">
                                <table *ngIf="!isLoading"
                                    class="table border-0 custom-table comman-table datatable mb-0">
                                    <thead>
                                        <tr>
                                            <th (click)="sortByName()">
                                                <img src="assets/img/icons/sort-icon-01.svg" alt>
                                                <img src="assets/img/icons/sort-icon-02.svg" alt>Name
                                            </th>

                                            <th>Description</th>
                                            <th>Color Consultation To Doctor</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr
                                            *ngFor="let item of filterdConsultationTypes | paginate: { itemsPerPage: 10, currentPage: p }; let i = index">


                                            <td>{{item.name}}</td>
                                            <td>{{item.description}}
                                            </td>
                                            <td [style.background-color]="item.color"></td>
                                            <td class="text-end">
                                                <div class="dropdown dropdown-action">
                                                    <a href="#" class="action-icon dropdown-toggle"
                                                        data-bs-toggle="dropdown" aria-expanded="false"><i
                                                            class="fa fa-ellipsis-v"></i></a>
                                                    <div class="dropdown-menu dropdown-menu-end">
                                                        <a class="dropdown-item">
                                                            <i class="fa fa-gear m-r-2"></i> Mettre à jour
                                                        </a>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr *ngIf="filterdConsultationTypes?.length == 0" class="no-appointment-row">
                                            <td colspan="8" class="description-content no-appointment-text">
                                                No Data Found!!
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div style="text-align:right;">
                                <pagination-controls (pageChange)="p = $event"></pagination-controls>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div id="delete_patient" class="modal fade delete-modal" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <img src="assets/img/sent.png" alt width="50" height="46">
                    <h3>Are you sure want to delete this ?</h3>
                    <div class="m-t-20"> <a href="#" class="btn btn-white" data-bs-dismiss="modal">Close</a>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
