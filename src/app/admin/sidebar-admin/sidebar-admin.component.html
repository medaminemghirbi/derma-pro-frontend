<div class="sidebar" id="sidebar">

  <!-- Start Logo -->
  <div class="sidebar-logo">
    <div>
      <!-- Logo Normal -->
      <a routerLink="/admin/dashboard" class="logo logo-normal">
        <img src="assets/img/logo.svg" alt="DERMA-TN Logo">
      </a>

      <!-- Logo Small -->
      <a routerLink="/admin/dashboard" class="logo-small">
        <img src="assets/img/logo-small.svg" alt="DERMA-TN Logo">
      </a>

      <!-- Logo Dark -->
      <a routerLink="/admin/dashboard" class="dark-logo">
        <img src="assets/img/logo-white.svg" alt="DERMA-TN Logo">
      </a>
    </div>
    <button class="sidenav-toggle-btn btn border-0 p-0 active" id="toggle_btn">
      <i class="ti ti-arrow-left text-body"></i>
    </button>

    <!-- Sidebar Menu Close -->
    <button class="sidebar-close">
      <i class="ti ti-x align-middle"></i>
    </button>
  </div>
  <!-- End Logo -->

  <!-- Sidenav Menu -->
  <div class="sidebar-inner" data-simplebar>
    <div id="sidebar-menu" class="sidebar-menu">
      <ul>
        <li class="menu-title"><span>Main Menu</span></li>
        <li>
          <ul>
            <li>
              <a routerLink="/admin/dashboard" routerLinkActive="active">
                <i class="ti ti-layout-dashboard"></i><span>Dashboard</span>
              </a>
            </li>
          </ul>
        </li>
        <li class="menu-title"><span>Medical Management</span></li>
        <li>
          <ul>
            <li>
              <a routerLink="/admin/doctors" routerLinkActive="active">
                <i class="ti ti-menu-alt"></i><span>Department Management</span>
              </a>
            </li>
            <li>
              <a routerLink="/admin/doctors" routerLinkActive="active">
                <i class="ti ti-user-plus"></i><span>Doctors Management</span>
              </a>
            </li>
            <li>
              <a routerLink="/admin/planning" routerLinkActive="active">
                <i class="ti ti-calendar-check"></i><span>Planning & Appointments</span>
              </a>
            </li>
            <li>
              <a routerLink="/admin/consultation-types" routerLinkActive="active">
                <i class="ti ti-stethoscope"></i><span>Consultation Types</span>
              </a>
            </li>
          </ul>
        </li>
        <li class="menu-title"><span>Reports & Analytics</span></li>
        <li>
          <ul>
            <li>
              <a href="javascript:void(0);" (click)="viewStatistics()">
                <i class="ti ti-chart-bar"></i><span>Statistics</span>
              </a>
            </li>
            <li>
              <a href="javascript:void(0);" (click)="viewReports()">
                <i class="ti ti-report"></i><span>System Reports</span>
              </a>
            </li>
          </ul>
        </li>
        <li class="menu-title"><span>System Management</span></li>
        <li>
          <ul>
            <li>
              <a href="javascript:void(0);" (click)="reloadSystemData()">
                <i class="ti ti-refresh"></i><span>Reload Data</span>
              </a>
            </li>
            <li>
              <a href="javascript:void(0);" (click)="viewSystemStatus()">
                <i class="ti ti-activity"></i><span>System Status</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
    <div class="sidebar-footer border-top mt-3">
      <div class="logout-section p-3 text-center">
        <button class="btn btn-outline-danger btn-sm w-100" (click)="logout()">
          <i class="ti ti-logout me-2"></i>Logout
        </button>
      </div>
    </div>
  </div>

</div>
